name: 3D contribution graph

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *' # 03:00 KST
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-3d

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph
          path: profile-3d-contrib/profile-green-animate.svg
          if-no-files-found: error
          retention-days: 1

  # Only this job can write, and it publishes to the output branch so main stays clean.
  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git switch --orphan output
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graph
          path: profile-3d-contrib
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-green-animate.svg
          git commit -m "chore: update 3D contribution graph"
          git push --force origin HEAD:output
